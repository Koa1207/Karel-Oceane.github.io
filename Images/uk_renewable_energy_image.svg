      <stop offset="100%" stop-color="#06060a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1f10"/>
      <stop offset="100%" stop-color="#06060a"/>
